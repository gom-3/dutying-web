name: Cypress E2E Test

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Cypress specs
        id: cypress-specs
        run: |
          if [ -d apps/app/cypress/e2e ] && find apps/app/cypress/e2e -type f \( -name '*.cy.js' -o -name '*.cy.jsx' -o -name '*.cy.ts' -o -name '*.cy.tsx' \) | grep -q .; then
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node.js 22.x
        if: steps.cypress-specs.outputs.has_specs == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: Install pnpm
        if: steps.cypress-specs.outputs.has_specs == 'true'
        run: npm install -g pnpm
      - name: npm ci
        if: steps.cypress-specs.outputs.has_specs == 'true'
        run: PUPPETEER_DOWNLOAD_BASE_URL="https://storage.googleapis.com/chrome-for-testing-public" pnpm install --frozen-lockfile
      - name: Install Cypress binary
        if: steps.cypress-specs.outputs.has_specs == 'true'
        run: pnpm --dir ./apps/app exec cypress install
      - name: Cypress run
        if: steps.cypress-specs.outputs.has_specs == 'true'
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: apps/app
          command: pnpm exec cypress run
        env:
          CYPRESS_id: ${{ secrets.TESTING_ID }}
          CYPRESS_pw: ${{ secrets.TESTING_PW }}
          CYPRESS_host: ${{ secrets.TESTING_HOST }}
      - name: Skip Cypress run
        if: steps.cypress-specs.outputs.has_specs != 'true'
        run: echo "No Cypress spec files found. Skipping Cypress run."
