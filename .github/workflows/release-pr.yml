name: Release PR

on:
    push:
        branches:
            - develop

concurrency:
    group: release-pr-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-pr:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.12.4

            - name: Use Node.js 22.x
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: PUPPETEER_DOWNLOAD_BASE_URL="https://storage.googleapis.com/chrome-for-testing-public" pnpm install --frozen-lockfile

            - name: Validate release changelog helpers
              run: pnpm run release:test

            - name: Create or update release pull request
              uses: changesets/action@v1
              with:
                  version: pnpm run release:version
                  title: 'chore: release packages'
                  commit: 'chore: release packages'
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
